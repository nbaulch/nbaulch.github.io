project:
  type: website
  output-dir: _site
  # Only these pages are part of the site. Everything else in the repo is working material.
  render:
    - index.qmd
    - resume.qmd
    - ai-economy.qmd
    - interest-rates.qmd
    - inflation.qmd
    - trade.qmd
    - trade-release.qmd
    - sources.qmd
    - 404.qmd
  resources:
    - fonts/*.ttf
    - fonts/*.woff2
    - images/*
    - charts/*/output/*.csv
    - charts/*/output/*.png

website:
  title: "Nicholas Baulch"
  site-url: https://nbaulch.github.io/
  description: "Economist. Macroeconomic scenarios, stress testing, and U.S. economic data."
  image: images/preview.jpg
  favicon: images/favicon.svg
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  search: false
  navbar:
    background: "#f6f3ec"
    foreground: "#222220"
    right:
      - text: Charts
        menu:
          - href: ai-economy.qmd
            text: The AI economy
          - href: interest-rates.qmd
            text: Interest rates
          - href: inflation.qmd
            text: Inflation
          - href: trade.qmd
            text: Trade
      - text: Releases
        menu:
          - href: trade-release.qmd
            text: Trade
      - href: resume.qmd
        text: Resume
  page-footer:
    left: "A personal site, not affiliated with any employer."

format:
  html:
    theme: default
    css: styles.css
    # Phones use this for home-screen bookmarks; they ignore SVG favicons.
    include-in-header:
      text: '<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">'
    grid:
      body-width: 720px
    toc: false
    anchor-sections: false
